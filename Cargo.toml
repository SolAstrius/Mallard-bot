[package]
name = "mallard-bot"
version = "0.1.0"
edition = "2021"
description = "Mallard Telegram bot — Rust rewrite"
license = "MIT"

[lib]
name = "mallard_bot"
path = "src/lib.rs"

[[bin]]
name = "mallard-bot"
path = "src/main.rs"

[dependencies]
rand = "0.8"
regex = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
anyhow = "1"
thiserror = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "sync"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dotenvy = "0.15"
emojis = "0.8"
url = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
caith = "4.2.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
brotli = { version = "8.0.2", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
fend-core = "1.5"
symbolica = { version = "1.5", default-features = false, features = ["faster_alloc"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "dnssec-ring"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std", "dnssec-ring"] }
binwalk = "3.1"
infer = "0.19"
file-format = "0.29"
kamadak-exif = "0.6"
nom-exif = "3"
little_exif = "0.6"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
# capstone defaults: full + std + support_all_archs (all 25-ish ISAs).
# We want them all for the architecture-guess heuristic.
capstone = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
x509-parser = "0.16"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
