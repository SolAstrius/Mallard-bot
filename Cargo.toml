[package]
name = "mallard-bot"
version = "0.1.0"
edition = "2021"
description = "Mallard Telegram bot — Rust rewrite"
license = "MIT"

[lib]
name = "mallard_bot"
path = "src/lib.rs"

[[bin]]
name = "mallard-bot"
path = "src/main.rs"

[dependencies]
rand = "0.8"
regex = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
anyhow = "1"
thiserror = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "sync"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dotenvy = "0.15"
emojis = "0.8"
url = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
