[package]
name = "mallard-bot"
version = "0.1.0"
edition = "2021"
description = "Mallard Telegram bot — Rust rewrite"
license = "MIT"

[lib]
name = "mallard_bot"
path = "src/lib.rs"

[[bin]]
name = "mallard-bot"
path = "src/main.rs"

[dependencies]
rand = "0.8"
regex = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
