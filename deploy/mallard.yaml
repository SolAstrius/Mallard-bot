apiVersion: v1
kind: Namespace
metadata:
  name: mallard
---
# Secret is created out-of-band from the local .env file:
#   kubectl -n mallard create secret generic mallard-bot-env \
#     --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
# Do NOT commit a Secret manifest with real values to this repo.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mallard-bot
  namespace: mallard
  labels:
    app: mallard-bot
spec:
  replicas: 1
  # Telegram getUpdates is a singleton — never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mallard-bot
  template:
    metadata:
      labels:
        app: mallard-bot
    spec:
      containers:
        - name: bot
          image: mallard-bot:28679ff
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mallard-bot-env
          env:
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
