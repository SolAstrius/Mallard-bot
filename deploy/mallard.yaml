apiVersion: v1
kind: Namespace
metadata:
  name: mallard
---
# Secret is created out-of-band from the local .env file:
#   kubectl -n mallard create secret generic mallard-bot-env \
#     --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
# Do NOT commit a Secret manifest with real values to this repo.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mallard-voices
  namespace: mallard
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-zfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mallard-data
  namespace: mallard
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-zfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mallard-bot
  namespace: mallard
  labels:
    app: mallard-bot
spec:
  replicas: 1
  # Telegram getUpdates is a singleton — never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mallard-bot
  template:
    metadata:
      labels:
        app: mallard-bot
    spec:
      initContainers:
        # Seed the persistent voices/ PVC from the image-baked defaults the
        # first time the pod starts. `cp -rn` (no-clobber) means user-added
        # clips persist across image upgrades.
        - name: seed-voices
          image: mallard-bot:006d32a
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -rn /app/default-voices/. /app/voices/ || true"]
          volumeMounts:
            - name: voices
              mountPath: /app/voices
      containers:
        - name: bot
          image: mallard-bot:006d32a
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mallard-bot-env
          env:
            - name: RUST_LOG
              value: "info"
            # Local Bot API server raises the getFile cap to 2 GB. See
            # deploy/tbot-api.yaml.
            - name: TG_API_URL
              value: "http://tbot-api.mallard.svc.cluster.local:8081"
            - name: TG_DOWNLOAD_MAX_BYTES
              # 2 GB — the upstream cap when going through a self-hosted
              # Bot API server.
              value: "2147483648"
          volumeMounts:
            - name: voices
              mountPath: /app/voices
            - name: data
              mountPath: /app/data
            # Read-only access to the self-hosted Bot API server's file
            # cache. With --local mode on tbot-api, getFile returns
            # absolute paths into this tree.
            - name: tbot-api-files
              mountPath: /var/lib/telegram-bot-api
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1500m"
              # 2.5 Gi accommodates the nix-catalog refresh peak: 80 MB of
              # decompressed JSON parsed into Value-heavy structs, plus FTS5
              # bulk-insert overhead. Steady-state RSS is ~150 MB.
              memory: "2500Mi"
      volumes:
        - name: voices
          persistentVolumeClaim:
            claimName: mallard-voices
        - name: data
          persistentVolumeClaim:
            claimName: mallard-data
        - name: tbot-api-files
          hostPath:
            path: /data/k8s/tbot-api
            type: DirectoryOrCreate
